[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "pcspace"
dynamic = ["version"]
description = "Local-first, folder-first Windows storage explorer with an interactive treemap"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sionchu and PCSpace contributors"}]
keywords = ["windows", "disk-usage", "treemap", "storage", "cleanup", "local-first"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "Send2Trash==2.1.0; sys_platform == 'win32'",
  "pywin32>=312,<313; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx==0.28.1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/sionchu/pcspace"
Issues = "https://github.com/sionchu/pcspace/issues"
Source = "https://github.com/sionchu/pcspace"

[project.scripts]
pcspace = "pcspace.__main__:main"

[tool.setuptools]
packages = ["pcspace"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pcspace.__version__"}

[tool.setuptools.package-data]
pcspace = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
